plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17.18'
	id 'maven-publish'
}

version = '1.0.0'
group = 'com.litematicahub'

base {
	archivesName = 'litematica-online-hub-1.21.11'
}

repositories {
	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
	maven { url 'https://masa.dy.fi/maven' }
}

loom {
	mods {
		"litematicahub" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:1.21.11"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:0.19.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"

	// Litematica and MaLiLib are compile-time only. Drop the jars matching
	// LIITEMATICA_JAR / MALILIB_JAR (see gradle.properties) into ./libs so the
	// project builds on any machine.
	modCompileOnly files(rootProject.file(litematica_jar))
	modCompileOnly files(rootProject.file(malilib_jar))
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", "1.21.11"
	inputs.property "loader_version", "0.19.3"
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": "1.21.11",
				"loader_version": "0.19.3"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
